<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Story Uploader – TikTok login</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #222; }
    textarea { width: 100%; height: 110px; font-family: ui-monospace, monospace; font-size: 13px; }
    button { margin-top: 10px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h2 id="title">TikTok login</h2>
  <p id="info">Copy this address and paste it into the terminal where <code>main.py tiktok-login</code> is waiting.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Copy</button>
  <script>
    const params = new URLSearchParams(location.search);
    const box = document.getElementById("url");
    box.value = location.href;
    if (params.get("error")) {
      document.getElementById("title").textContent = "TikTok login failed";
      document.getElementById("info").innerHTML =
        '<span class="error">' + params.get("error") + ": " + (params.get("error_description") || "") + "</span>";
    }
    document.getElementById("copy").onclick = () => {
      navigator.clipboard.writeText(box.value);
      document.getElementById("copy").textContent = "Copied ✓";
    };
  </script>
</body>
</html>
